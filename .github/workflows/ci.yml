name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python scripts/compile_po.py
      - run: python manage.py makemigrations --check --dry-run
        env: {SECRET_KEY: ci-secret}
      - run: pytest
        env: {SECRET_KEY: ci-secret}
      - run: DEBUG=False python manage.py check --deploy
        env: {SECRET_KEY: ci-secret, ALLOWED_HOSTS: example.com}
