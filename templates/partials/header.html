{% load i18n site_extras %}
<header class="header">
  <div class="wrap header__inner">
    <a class="brand" href="{% url 'core:home' %}">
      <span class="brand__mark" aria-hidden="true">{{ site.full_name|initials }}</span>
      <span>{{ site.full_name }}</span>
    </a>

    <nav class="nav" data-nav aria-label="{% trans 'Main' %}">
      <a href="{% url 'projects:list' %}" {% if '/work/' in request.path %}aria-current="page"{% endif %}>{% trans "Work" %}</a>
      <a href="{% url 'core:about' %}" {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>{% trans "About" %}</a>
      <a href="{% url 'core:cv' %}" {% if request.resolver_match.url_name == 'cv' %}aria-current="page"{% endif %}>{% trans "Résumé" %}</a>
      <a href="{% url 'core:contact' %}" {% if request.resolver_match.url_name == 'contact' %}aria-current="page"{% endif %}>{% trans "Contact" %}</a>
    </nav>

    <div class="header__tools">
      <button class="kbd-hint" data-cmdk-open type="button" aria-label="{% trans 'Open command palette' %}">⌘K</button>

      <div class="lang">
        <button class="lang__btn" data-lang-toggle type="button" aria-expanded="false" aria-haspopup="true">
          {{ LANGUAGE_CODE }}
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="lang__menu" data-lang-menu>
          {% for code, name in LANGUAGES %}
            <a href="{% switch_lang_url code %}" lang="{{ code }}"
               {% if code == LANGUAGE_CODE %}aria-current="true"{% endif %}>{{ name }}</a>
          {% endfor %}
        </div>
      </div>

      <button class="icon-btn" data-theme-toggle type="button" aria-pressed="false" aria-label="{% trans 'Toggle theme' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>

      <button class="icon-btn nav-toggle" data-nav-toggle type="button" aria-expanded="false" aria-label="{% trans 'Menu' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>
