{% load static %}
<style>
/* Launcher: a large gradient orb with a label under it. Styled here so it is right before widget.css loads. */
.ai-fab {
  position: fixed;
  right: calc(1.5rem + env(safe-area-inset-right));
  bottom: calc(1.5rem + env(safe-area-inset-bottom));
  z-index: 95;
  display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
  padding: 0; border: 0; background: none; color: var(--text);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.ai-fab__orb {
  position: relative; display: grid; place-items: center;
  width: 68px; height: 68px; border-radius: 50%;
  background: linear-gradient(135deg, var(--turquoise), var(--indigo));
  color: #fff;
  box-shadow: 0 14px 34px -10px color-mix(in srgb, var(--indigo) 70%, transparent),
              0 0 0 1px color-mix(in srgb, #fff 18%, transparent) inset;
  transition: transform var(--dur) var(--ease-back), box-shadow var(--dur) var(--ease);
}
.ai-fab__orb::after {               /* soft ring that pulses a few times after load */
  content: ""; position: absolute; inset: -6px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--turquoise) 55%, transparent);
  opacity: 0; animation: ai-ring 2.4s var(--ease-out) 1.2s 4;
}
.ai-fab__orb svg { width: 30px; height: 30px; }
.ai-fab__label {
  padding: 0.3rem 0.75rem; border-radius: var(--radius-full);
  background: var(--surface); border: 1px solid var(--border-strong);
  font: 600 13px/1.2 var(--font-body); letter-spacing: 0.01em; white-space: nowrap;
  box-shadow: var(--shadow-md);
}
.ai-fab:hover .ai-fab__orb { transform: translateY(-3px) scale(1.04);
  box-shadow: 0 20px 40px -12px color-mix(in srgb, var(--indigo) 80%, transparent); }
.ai-fab:active .ai-fab__orb { transform: scale(0.96); }
.ai-fab:focus-visible { outline: none; }
.ai-fab:focus-visible .ai-fab__orb { outline: 3px solid var(--accent); outline-offset: 4px; }
.ai-fab.is-loading .ai-fab__orb { animation: ai-pulse 0.9s ease-in-out infinite; }
.ai-fab__badge {
  position: absolute; top: -2px; right: -2px;
  min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: var(--radius-full); background: var(--brass); color: #fff;
  font: 700 12px/22px var(--font-mono); text-align: center;
  box-shadow: 0 0 0 3px var(--bg);
}
.ai-tease {
  position: fixed; z-index: 95;
  right: calc(1.5rem + env(safe-area-inset-right));
  bottom: calc(1.5rem + 118px + env(safe-area-inset-bottom));
  max-width: 270px; padding: 0.7rem 2rem 0.7rem 0.9rem;
  border-radius: 14px 14px 4px 14px;
  background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-lg); font: 400 14px/1.4 var(--font-body);
  cursor: pointer; animation: ai-tease-in 0.4s var(--ease-out) both;
}
.ai-tease b { display: block; font-weight: 600; margin-bottom: 2px; }
.ai-tease__x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border: 0;
  background: none; color: var(--text-faint); font-size: 16px; cursor: pointer; border-radius: 50%; }
.ai-tease__x:hover { color: var(--text); background: var(--surface-2); }
.ai[data-open="true"] .ai-fab, .ai[data-open="true"] .ai-tease { opacity: 0; pointer-events: none; transform: translateY(10px); }
@keyframes ai-pulse { 50% { transform: scale(0.9); opacity: 0.75; } }
@keyframes ai-ring { 0% { opacity: 0.9; transform: scale(0.92); } 100% { opacity: 0; transform: scale(1.35); } }
@keyframes ai-tease-in { from { opacity: 0; transform: translateY(8px) scale(0.97); } }
@media (max-width: 640px) {
  .ai-fab { right: calc(1rem + env(safe-area-inset-right)); bottom: calc(1.25rem + env(safe-area-inset-bottom)); }
  .ai-fab__orb { width: 62px; height: 62px; }
  .ai-fab__orb svg { width: 28px; height: 28px; }
  .ai-fab__label { font-size: 12px; padding: 0.25rem 0.65rem; }
  .ai-tease { right: calc(1rem + env(safe-area-inset-right)); bottom: calc(1.25rem + 108px + env(safe-area-inset-bottom));
              border-radius: 14px 14px 4px 14px; max-width: min(260px, calc(100vw - 2rem)); }
}
@media (prefers-reduced-motion: reduce) { .ai-fab__orb::after, .ai-tease { animation: none; } }
@media print { .ai { display: none; } }
</style>
{# AI assistant: the button is server-rendered; CSS and JS load on the first click (or when idle). #}
<div class="ai" data-ai data-css="{% static 'ai/widget.css' %}" data-js="{% static 'ai/widget.js' %}"
     data-config='{{ config_json }}'>
  <button class="ai-fab" data-ai-open type="button" aria-haspopup="dialog" aria-expanded="false"
          aria-controls="ai-panel" title="{{ ui.open }}">
    <span class="ai-fab__orb" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.2-4.6A8.5 8.5 0 1 1 21 12Z"/>
        <path d="M12 7.6l1.05 2.85 2.85 1.05-2.85 1.05L12 15.4l-1.05-2.85L8.1 11.5l2.85-1.05Z" fill="currentColor" stroke="none"/>
      </svg>
      <span class="ai-fab__badge" data-ai-badge hidden></span>
    </span>
    <span class="ai-fab__label">{{ ui.fab }}</span>
  </button>
  <div class="ai-tease" data-ai-tease role="button" tabindex="0" hidden>
    <b>{{ ui.tease_title }}</b>{{ ui.tease_text }}
    <button type="button" class="ai-tease__x" data-ai-tease-close aria-label="{{ ui.close }}">&times;</button>
  </div>

  <section class="ai-panel" id="ai-panel" data-ai-panel role="dialog" aria-modal="true"
           aria-label="{{ ui.title }}" data-lenis-prevent hidden>
    <header class="ai-head">
      <div class="ai-head__id">
        <span class="ai-avatar" aria-hidden="true">{{ initials }}</span>
        <div class="ai-head__text">
          <strong>{{ ui.title }}</strong>
          <small data-ai-status>{% if owner %}{{ ui.owner }}{% else %}{{ ui.subtitle }}{% endif %}</small>
        </div>
      </div>
      <div class="ai-head__tools">
        <div class="ai-mode" data-ai-mode hidden role="group">
          <button type="button" data-mode="local" aria-pressed="true">{{ ui.mode_site }}</button>
          <button type="button" data-mode="web" aria-pressed="false">{{ ui.mode_web }}</button>
        </div>
        <button type="button" class="ai-icon" data-ai-new title="{{ ui.new }}" aria-label="{{ ui.new }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="ai-icon" data-ai-close title="{{ ui.close }}" aria-label="{{ ui.close }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <div class="ai-body" data-ai-log role="log" aria-live="polite"></div>

    <div class="ai-chips" data-ai-chips></div>
    <div class="ai-actions" data-ai-actions></div>

    <form class="ai-composer" data-ai-form autocomplete="off">
      <div class="ai-preview" data-ai-preview hidden></div>
      <div class="ai-row">
        <button type="button" class="ai-icon ai-icon--tool" data-ai-attach title="{{ ui.attach }}" aria-label="{{ ui.attach }}" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11.5-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7L10 17.7a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>
        </button>
        <input type="file" accept="image/*,.pdf,application/pdf" data-ai-file hidden>
        <button type="button" class="ai-icon ai-icon--tool" data-ai-mic title="{{ ui.voice }}" aria-label="{{ ui.voice }}" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <textarea class="ai-input" data-ai-input rows="1" placeholder="{{ ui.placeholder }}" aria-label="{{ ui.placeholder }}" maxlength="2000"></textarea>
        <button type="submit" class="ai-send" data-ai-send aria-label="{{ ui.send }}" title="{{ ui.send }}">
          <svg class="ai-send__go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
          <svg class="ai-send__stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
      <p class="ai-note">{{ ui.note }}</p>
    </form>
  </section>
</div>
<script>
(function () {
  var root = document.querySelector("[data-ai]");
  if (!root) return;
  var btn = root.querySelector("[data-ai-open]");
  var loading = null;
  function load() {
    if (loading) return loading;
    loading = new Promise(function (resolve, reject) {
      var link = document.createElement("link");
      link.rel = "stylesheet"; link.href = root.dataset.css;
      link.onload = function () {
        import(root.dataset.js).then(function (m) { m.init(root); resolve(m); }).catch(reject);
      };
      link.onerror = reject;
      document.head.appendChild(link);
    });
    return loading;
  }
  function open(question) {
    btn.classList.add("is-loading");
    load().then(function (m) { btn.classList.remove("is-loading"); m.open(question); })
          .catch(function () { btn.classList.remove("is-loading"); });
  }
  btn.addEventListener("click", function () { if (!root.dataset.ready) open(); });
  btn.addEventListener("pointerenter", function () { load(); }, { once: true });
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href="#ai"], [data-ai-ask]');
    if (!a) return;
    e.preventDefault();
    open(a.getAttribute("data-ai-ask") || "");
  });
  if (location.hash === "#ai") setTimeout(function () { open(); }, 400);
  var tease = root.querySelector("[data-ai-tease]");
  var seen = false;
  try { seen = sessionStorage.getItem("ai:teased") === "1"; } catch (e) {}
  if (tease && !seen) {
    setTimeout(function () {
      if (root.dataset.open === "true") return;
      tease.hidden = false;
      try { sessionStorage.setItem("ai:teased", "1"); } catch (e) {}
      setTimeout(function () { tease.hidden = true; }, 12000);
    }, 7000);
    tease.addEventListener("click", function (e) {
      tease.hidden = true;
      if (!e.target.closest("[data-ai-tease-close]")) open();
    });
  }
  window.addEventListener("load", function () {
    setTimeout(function () { (window.requestIdleCallback || setTimeout)(function () { load(); }); }, 3000);
  });
})();
</script>
